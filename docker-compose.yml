# The database still answers to `concurrencyflow`, and deliberately so: Postgres
# only runs initdb on an empty volume, so renaming the role and the database
# here would leave every existing `pgdata` volume — every plan anyone is already
# keeping — with no user that can reach it. It is an internal name behind a
# private network; the rebrand stops at the door.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: concurrencyflow
      POSTGRES_PASSWORD: concurrencyflow
      POSTGRES_DB: concurrencyflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concurrencyflow -d concurrencyflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgres://concurrencyflow:concurrencyflow@db:5432/concurrencyflow
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
